 ពាក្យថា «អង្គការ» (ឬអង្គការលើ) ជារហស្សនាមសំដៅលើស្ថាប័នអ្វីឱ្យពិតប្រាកដ?","o":["រដ្ឋាភិបាលរួបរួមជាតិកម្ពុជា","គណៈកម្មាធិការមជ្ឈិមបក្សកុម្មុយនិស្តកម្ពុជា","ក្រសួងសន្តិសុខជាតិ","តុលាការប្រជាជន"],"a":1,"c":0,"d":"h","e":""},{"q":"តើមេដឹកនាំជាន់ខ្ពស់ខ្មែរក្រហម អៀង សារី ធ្លាប់កាន់តំណែងជាអ្វីនៅក្នុងរបបកម្ពុជាប្រជាធិបតេយ្យ?","o":["ប្រធានគណៈប្រធានរដ្ឋ","នាយករដ្ឋមន្ត្រី","រដ្ឋមន្ត្រីក្រសួងការពារជាតិ","ឧបនាយករដ្ឋមន្ត្រី និងជារដ្ឋមន្ត្រីក្រសួងការបរទេស"],"a":3,"c":0,"d":"h","e":""},{"q":"តើការបោះឆ្នោតជាតិសកលជាលើកដំបូងបំផុត ក្រោយកិច្ចព្រមព្រៀងសន្តិភាពទីក្រុងប៉ារីស ដែលរៀបចំដោយ UNTAC ប្រព្រឹត្តទៅនៅខែ ឆ្នាំណា?","o":["ខែតុលា ឆ្នាំ១៩៩១","ខែឧសភា ឆ្នាំ១៩៩៣","ខែកញ្ញា ឆ្នាំ១៩៩៣","ខែកក្កដា ឆ្នាំ១៩៩៨"],"a":1,"c":0,"d":"h","e":""},{"q":"តាមរដ្ឋធម្មនុញ្ញឆ្នាំ១៩៩៣ តើប្រព័ន្ធនយោបាយរបស់ព្រះរាជាណាចក្រកម្ពុជា គឺជាប្រព័ន្ធនយោបាយបែបណា?","o":["ប្រជាធិបតេយ្យសេរីពហុបក្ស","សង្គមនិយម","របបរាជានិយមផ្តាច់ការ","សាធារណរដ្ឋសហព័ន្ធ"],"a":0,"c":0,"d":"h","e":""},{"q":"តើប្រទេសកម្ពុជាត្រូវបានអង្គការសហប្រជាជាតិ (UN) សម្រេចទទួលស្គាល់ និងអនុញ្ញាតឱ្យចូលជាសមាជិកពេញសិទ្ធិ នៅឆ្នាំណា?","o":["ឆ្នាំ១៩៥៣","ឆ្នាំ១៩៥៥","ឆ្នាំ១៩៩១","ឆ្នាំ១៩៩៣"],"a":1,"c":0,"d":"h","e":""},{"q":"តើសារមន្ទីរឧក្រិដ្ឋកម្មប្រល័យពូជសាសន៍ទួលស្លែង (អតីតគុក ស-២១) ត្រូវបានអង្គការយូណេស្កូចុះបញ្ជីក្នុង «បញ្ជីសតិរបស់ពិភពលោក» (Memory of the World Register) នៅឆ្នាំណា?","o":["ឆ្នាំ២០០៣","ឆ្នាំ២០០៩","ឆ្នាំ២០១២","ឆ្នាំ២០១៨"],"a":1,"c":0,"d":"h","e":""},{"q":"តើកម្ពុជាបានធ្វើជាម្ចាស់ផ្ទះរៀបចំកិច្ចប្រជុំកំពូលអាស៊ី-អឺរ៉ុប លើកទី១៣ (ASEM-13) ដោយជោគជ័យតាមប្រព័ន្ធវីដេអូ នៅឆ្នាំណា?","o":["ឆ្នាំ២០១២","ឆ្នាំ២០២០","ឆ្នាំ២០២១","ឆ្នាំ២០២២"],"a":2,"c":0,"d":"h","e":""},{"q":"តើក្នុងឋានៈជាប្រធានអាស៊ានរបស់ឆ្នាំ២០២២ តើកម្ពុជាបានកំណត់យកមូលបទ (Theme) អាស៊ានជាអ្វី?","o":["អាស៊ានរួបរួមគ្នាក្នុងភាពចម្រុះ","អាស៊ានរួមគ្នាធ្វើ៖ ដោះស្រាយបញ្ហាប្រឈមទាំងអស់គ្នា (ASEAN A.C.T.)","អាស៊ានដើម្បីសន្តិភាព និងវិបុលភាព","អាស៊ានឆ្ពោះទៅកាន់សហគមន៍តែមួយ"],"a":1,"c":0,"d":"h","e":""},{"q":"តើទិវាជាតិនៃការចងចាំ (ទិវាចងកំហឹង) ដើម្បីរំលឹកដល់វិញ្ញាណក្ខន្ធជនរងគ្រោះក្នុងរបបប្រល័យពូជសាសន៍ប៉ុល ពត ត្រូវបានកំណត់យកថ្ងៃទីខែណាជាតរៀងរាល់ឆ្នាំ?","o":["ថ្ងៃទី០៧ ខែមករា","ថ្ងៃទី១៧ ខែមេសា","ថ្ងៃទី២០ ខែឧសភា","ថ្ងៃទី២៣ ខែតុលា"],"a":2,"c":0,"d":"h","e":""},{"q":"តើកម្មវិធីនយោបាយ «យុទ្ធសាស្ត្របញ្ចកោណ-ដំណាក់កាលទី១» របស់រាជរដ្ឋាភិបាលនីតិកាលទី៧ ត្រូវបានប្រកាសដាក់ឱ្យអនុវត្តជាផ្លូវការនៅថ្ងៃខែឆ្នាំណា?","o":["ថ្ងៃទី២៣ ខែកក្កដា ឆ្នាំ២០២៣","ថ្ងៃទី២៤ ខែសីហា ឆ្នាំ២០២៣","ថ្ងៃទី០៩ ខែវិច្ឆិកា ឆ្នាំ២០២៣","ថ្ងៃទី០១ ខែមករា ឆ្នាំ២០២៤"],"a":1,"c":0,"d":"h","e":""},{"q":"តើព្រះបាទហ៊ុនទៀន (កៅណ្ឌិន្យទី១) បានរៀបអភិសេកជាមួយព្រះនាងណា ដែលជាការចាប់ផ្តើមនៃរាជវង្ស និងការស្ថាបនាអាណាចក្រហ្វូណន?","o":["ព្រះនាងសោមា (លីវយី)","ព្រះនាងឥន្ទ្រទេវី","ព្រះនាងជ័យរាជទេវី","ព្រះនាងកម្ពុជារាជលក្ស្មី"],"a":0,"c":0,"d":"h","e":""},{"q":"តើប្រាសាទបន្ទាយឆ្មារ (ស្ថិតក្នុងខេត្តបន្ទាយមានជ័យ) ត្រូវបានកសាងឡើងដោយព្រះមហាក្សត្រអង្គណា?","o":["ព្រះបាទសូរ្យវរ្ម័នទី២","ព្រះបាទយសោវរ្ម័នទី១","ព្រះបាទជ័យវរ្ម័នទី៧","ព្រះបាទជ័យវរ្ម័នទី៤"],"a":2,"c":0,"d":"h","e":""},{"q":"តើក្រោយពីចាកចេញពីទីក្រុងអង្គរ ព្រះបាទពញាយ៉ាតបានប្តូររាជធានីមកតាំងនៅទួលបាសាន (ស្រុកស្រីសន្ធរ) ស្ថិតក្នុងខេត្តណា មុននឹងបន្តមកចតុមុខ?","o":["ខេត្តកំពង់ចាម","ខេត្តកណ្តាល","ខេត្តកំពង់ឆ្នាំង","ខេត្តពោធិ៍សាត់"],"a":0,"c":0,"d":"h","e":""},{"q":"តើសន្ធិសញ្ញាបារាំង-សៀម ឆ្នាំ១៩០៧ ដែលសៀមប្រគល់ខេត្តបាត់ដំបង សៀមរាប និងសិរីសោភ័ណ មកឱ្យកម្ពុជាវិញ ធ្វើឡើងក្នុងរជ្ជកាលព្រះមហាក្សត្រអង្គណា?","o":["ព្រះបាទនរោត្តម","ព្រះបាទស៊ីសុវត្ថិ","ព្រះបាទស៊ីសុវត្ថិ មុនីវង្ស","ព្រះបាទនរោត្តម សុរាម្រិត"],"a":1,"c":0,"d":"h","e":""},{"q":"តើព្រះមហាក្សត្រអង្គណាដែលទទួលបានព្រះបរមរាជឆ្មង្គនាម (ព្រះនាមក្រោយពេលសោយទិវង្គត) ថា «ព្រះករុណា ព្រះបរមរតនកោដ្ឋ»?","o":["ព្រះបាទនរោត្តម","ព្រះបាទស៊ីសុវត្ថិ មុនីវង្ស","ព្រះបាទនរោត្តម សុរាម្រិត","សម្តេចព្រះ នរោត្តម សីហនុ"],"a":3,"c":0,"d":"h","e":""},{"q":"តើនៅក្នុងសម័យសង្គមរាស្ត្រនិយម (១៩៥៥-១៩៧០) ប្រទេសកម្ពុជាទទួលបានកិត្តិនាម និងការគោរពសរសើររហូតទទួលបានរហស្សនាមថាអ្វី?","o":["គុជអាស៊ី (Pearl of Asia)","កោះសន្តិភាពនៅអាស៊ីអាគ្នេយ៍ (Oasis of Peace)","ខ្លាសេដ្ឋកិច្ចអាស៊ី (Asian Tiger)","ប្រទេសអព្យាក្រឹតអចិន្ត្រៃយ៍"],"a":1,"c":0,"d":"h","e":""},{"q":"តើឥស្សរជនណាដែលកាន់តំណែងជាប្រធានាធិបតីទី១ និង ើជាម្ចាស់ផ្ទះ តើប្រភេទកីឡាប្រណីជាតិណាខ្លះដែលត្រូវបានដាក់បញ្ចូលក្នុងវិញ្ញាសាប្រកួតជាផ្លូវការ?","o":["គុនល្បុក្កតោ គុនខ្មែរ និងអុកចត្រង្គ","ចាប់ និងទាញព្រ័ត្រ","បោកកន្សែង និងចោលឈូង","ប្រណាំងរទេះគោ និងប្រណាំងទូក"],"a":0,"c":0,"d":"h","e":""},{"q":"តើក្នុងសម័យអាណានិគមបារាំង ព្រះមហាក្សត្រអង្គណាដែលបានឡើងគ្រងរាជ្យបន្តបន្ទាប់ពីព្រះបាទនរោត្តមសោយទិវង្គតនៅឆ្នាំ១៩០៤?","o":["ព្រះបាទអង្គឌួង","ព្រះបាទស៊ីសុវត្ថិ មុនីវង្ស","ព្រះបាទស៊ីសុវត្ថិ","ព្រះបាទនរោត្តម សុរាម្រិត"],"a":2,"c":0,"d":"h","e":""},{"q":"តើ «សហភាពឥណ្ឌូចិន» (Indochinese Union) ដែលបង្កើតឡើងដោយបារាំងនៅឆ្នាំ១៨៨៧ រួមមានប្រទេស/តំបន់ណាខ្លះ?","o":["កម្ពុជា ថៃ និងឡាវ","កម្ពុជា ឡាវ និងវៀតណាម (ទុងកឹង អណ្ណាម កូសាំងស៊ីន)","កម្ពុជា ឡាវ និងភូមា","កម្ពុជា ម៉ាឡេ និងវៀតណាម"],"a":1,"c":0,"d":"h","e":""},{"q":"តើព្រះករុណា ព្រះបាទសម្តេចព្រះ នរោត្តម សីហនុ ទ្រង់បានប្រកាសដាក់រាជ្យថ្វាយព្រះបិតានៅឆ្នាំ១៩៥៥ ក្នុងគោលបំណងសំខាន់អ្វី?","o":["ដើម្បីយាងទៅរួសជាព្រះសង្ឃ","ដើម្បីបង្កើត និងដឹកនាំចលនានយោបាយ «សង្គមរាស្ត្រនិយម»","ដើម្បីយាងទៅរស់នៅប្រទេសបារាំង","ដើម្បីគេចពីការមេចាប់ខ្លួនរបស់ពួកខ្មែរឥស្សរៈ"],"a":1,"c":0,"d":"h","e":""},{"q":"តើសាកលវិទ្យាល័យភូមិន្ទវិចិត្រសិល្បៈ (RUFA) ដែលជាគ្រឹះស្ថានឧត្តមសិក្សាដ៏លេចធ្លោ ត្រូវបានបង្កើតឡើងនាសម័យសង្គមរាស្ត្រនិយម ក្នុងឆ្នាំណា?","o":["ឆ្នាំ១៩៦០","ឆ្នាំ១៩៦៤","ឆ្នាំ១៩៦៥","ឆ្នាំ១៩៦៩"],"a":2,"c":0,"d":"h","e":""},{"q":"តើនៅក្នុងរបបសាធារណរដ្ឋខ្មែរ (១៩៧០-១៩៧៥) តើប្រទេសមហាអំណាចមួយណាដែលបានផ្តល់ជំនួយយោធា និងសេដ្ឋកិច្ចយ៉ាងសន្ធឹកសន្ធាប់ដល់រដ្ឋាភិបាលលោក លន់ នល់?","o":["សហភាពសូវៀត","សហរដ្ឋអាមេរិក","ប្រទេសបារាំង","ប្រទេសចិន"],"a":1,"c":0,"d":"h","e":""},{"q":"តើទម្រង់សេដ្ឋកិច្ចរបស់របបកម្ពុជាប្រជាធិបតេយ្យ (ខ្មែរក្រហម) ត្រូវបានរៀបចំឡើងក្នុងទម្រង់បែបណា?","o":["សេដ្ឋកិច្ចទីផ្សារសេរី និងនាំចេញស្រូវ","លុបបំបាត់រូបិយប័ណ្ណ ទីផ្សារ សិទ្ធិកម្មសិទ្ធិឯកជន និងបង្ខំឱ្យធ្វើការរួមគ្នាជាសហករណ៍","សេដ្ឋកិច្ចចម្រុះ ដែលរដ្ឋនិងឯកជនសហការគ្នា","បើកចំហពាណិជ្ជកម្មតែជាមួយប្រទេសកុម្មុយនិស្ត"],"a":1,"c":0,"d":"h","e":""},{"q":"តើមុនពេលកិច្ចព្រមព្រៀងសន្តិភាពទីក្រុងប៉ារីស តើស្ថាប័នកំពូលមួយណាត្រូវបានបង្កើតឡើងនៅឆ្នាំ១៩៩០ ដើម្បីជាតំណាងអធិបតេយ្យភាពកម្ពុជាទាំងមូល?","o":["រដ្ឋាភិបាលចម្រុះត្រីភាគី","រណសិរ្សសាមគ្គីសង្គ្រោះជាតិកម្ពុជា","ក្រុមប្រឹក្សាជាតិជាន់ខ្ពស់ (SNC)","អាជ្ញាធររដ្ឋបាលអន្តរកាលអង្គការសហប្រជាជាតិ (UNTAC)"],"a":2,"c":0,"d":"h","e":""},{"q":"តើនរណាជាប្រធាននៃ «ក្រុមប្រឹក្សាជាតិជាន់ខ្ពស់» (SNC) ដែលតំណាងឱ្យភាគីជម្លោះកម្ពុជាទាំង៤?","o":["សម្តេច ហ៊ុន សែន","សម្តេចព្រះ នរោត្តម សីហនុ","លោក សឺន សាន","លោក ខៀវ សំផន"],"a":1,"c":0,"d":"h","e":""},{"q":"តើការបោះឆ្នោតជាតិដែលរៀបចំដោយអ៊ុនតាក់ (UNTAC) ក្នុងខែឧសភា ឆ្នាំ១៩៩៣ ប្រព្រឹត្តទៅដោយប្រើប្រព័ន្ធបោះឆ្នោតបែបណា?","o":["ប្រព័ន្ធឯកនាម","ប្រព័ន្ធចម្រុះ","ប្រព័ន្ធសមាមាត្រតំណាងរាជធានី-ខេត្ត","ប្រព័ន្ធបោះឆ្នោតជាសកលតែ១មណ្ឌលទូទាំងប្រទេស"],"a":2,"c":0,"d":"h","e":""},{"q":"តើស្ថាប័ន «ព្រឹទ្ធសភា» នៃព្រះរាជាណាចក្រកម្ពុជាទី២ ត្រូវបានបង្កើតឡើងជាលើកដំបូងបង្អស់នៅឆ្នាំណា ក្រោយមានវិរត្តិនយោបាយឆ្នាំ១៩៩៨?","o":["ឆ្នាំ១៩៩៣","ឆ្នាំ១៩៩៨","ឆ្នាំ១៩៩៩","ឆ្នាំ២០០៤"],"a":2,"c":0,"d":"h","e":""},{"q":"តើក្នុងប្រវត្តិសាស្ត្រនយោបាយកម្ពុជា តើ «នយោបាយឈ្នះ-ឈ្នះ» របស់សម្តេចតេជោ ហ៊ុន សែន បានបញ្ចប់អង្គការចាត់តាំងយោធា និងនយោបាយរបស់ខ្មែរក្រហមទាំងស្រុងនៅឆ្នាំណា?","o":["ឆ្នាំ១៩៩៣","ឆ្នាំ១៩៩៦","ឆ្នាំ១៩៩៨","ឆ្នាំ២០០៣"],"a":2,"c":0,"d":"h","e":""},{"q":"តើអាកាសយានដ្ឋានអន្តរជាតិតេជោ (Techo International Airport - TIA) ដែលកំពុងសាងសង់នៅខេត្តកណ្តាល-ខេត្តកែវ ជាប្រភេទយនយន្តហោះកម្រិតអ្វី?","o":["លំដាប់ថ្នាក់ 4D","លំដាប់ថ្នាក់ 4E","លំដាប់ថ្នាក់ 4F","លំដាប់ថ្នាក់ 5F"],"a":2,"c":0,"d":"h","e":""},{"q":"តើប្រាសាទកោះកេរ ដែលទើបត្រូវបានអង្គការយូណេស្កូចុះបញ្ជីជាបេតិកភណ្ឌពិភពលោក ត្រូវបានកសាងឡើងក្នុងរជ្ជកាលព្រះមហាក្សត្រអង្គណា?","o":["ព្រះបាទសូរ្យវរ្ម័នទី២","ព្រះបាទជ័យវរ្ម័នទី៤","ព្រះបាទជ័យវរ្ម័នទី៧","ព្រះបាទយសោវរ្ម័នទី១"],"a":1,"c":0,"d":"h","e":""},{"q":"តើរាជរដ្ឋាភិបាលនីតិកាលទី៧ នៃរដ្ឋសភា ដែលដឹកនាំដោយសម្តេចមហាបវរធិបតី ហ៊ុន ម៉ាណែត បានដាក់ចេញនូវកម្មវិធីនយោបាយអ្វី ដើម្បីអភិវឌ្ឍប្រទេសជាតិ?","o":["យុទ្ធសាស្ត្រត្រីកោណ","យុទ្ធសាស្ត្រចតុកោណ ដំណាក់កាលទី៤","យុទ្ធសាស្ត្របញ្ចកោណ ដំណាក់កាលទី១","គោលនយោបាយអភិវឌ្ឍន៍សេដ្ឋកិច្ចឌីជីថល"],"a":2,"c":0,"d":"h","e":""},{"q":"តើនៅក្នុងព្រឹត្តិការណ៍កីឡាស៊ីហ្គេម លើកទី៣២ ឆ្នាំ២០២៣ នៅកម្ពុជា តើកម្ពុជាទទួលបានចំណាត់ថ្ (v.length?'<div style="overflow-x:auto"><table class="tbl"><tr><th>#</th><th>សំណួរ</th><th>ប្រធានបទ</th><th>កម្រិត</th><th></th></tr>'+v.map(q=>'<tr><td>'+dg(bank.indexOf(q)+1)+'</td><td>'+esc(q.q)+'<br><small style="color:var(--em)">'+ic('check',13)+' '+L[q.a]+'. '+esc(q.o[q.a])+'</small></td><td><small>'+catN(q.c)+'</small></td><td><span class="badge '+q.d+'">'+DF[q.d]+'</span></td><td style="white-space:nowrap"><button class="btn g s" onclick="editQ(\''+q.id+'\')">'+ic('edit',15)+'</button> <button class="btn g s" onclick="delQ(\''+q.id+'\')">'+ic('trash',15)+'</button></td></tr>').join('')+'</table></div>':'<div class="emp">មិនមានសំណួរ</div>')+
'<div class="ra" style="justify-content:space-between;align-items:center"><small>'+dg(l.length)+' សំណួរ</small><div><button class="btn g s" '+(bp?'':'disabled')+' onclick="bp--;R()">'+ic('arrowL',15)+'</button> <b>'+dg(bp+1)+'/'+dg(pg)+'</b> <button class="btn g s" '+(bp<pg-1?'':'disabled')+' onclick="bp++;R()">'+ic('arrowR',15)+'</button></div></div></div>')}
function editQ(id){const q=bank.find(x=>x.id==id)||{q:'',o:['','','',''],a:0,c:0,d:'m',e:''};window._eid=id;modal('<h3>'+(id?'កែសំណួរ':'បន្ថែមសំណួរ')+'</h3><label class="f">សំណួរ</label><textarea class="i" id="fq" rows="3">'+esc(q.q)+'</textarea>'+[0,1,2,3].map(k=>'<label class="f">ជម្រើស '+L[k]+'</label><input class="i" id="fo'+k+'" value="'+esc(q.o[k])+'">').join('')+'<label class="f">ចម្លើយត្រូវ</label><select class="i" id="fa">'+L.split('').map((c,k)=>'<option value="'+k+'" '+(q.a==k?'selected':'')+'>'+c+'</option>').join('')+'</select><label class="f">ប្រធានបទ</label><select class="i" id="fc">'+CATS.map((c,i)=>'<option value="'+i+'" '+(q.c==i?'selected':'')+'>'+c[0]+'</option>').join('')+'</select><label class="f">កម្រិត</label><select class="i" id="fd">'+['e','m','h'].map(d=>'<option value="'+d+'" '+(q.d==d?'selected':'')+'>'+DF[d]+'</option>').join('')+'</select><label class="f">ការពន្យល់</label><textarea class="i" id="fe" rows="2">'+esc(q.e||'')+'</textarea><div class="ra"><button class="btn g" onclick="closeM()">បោះបង់</button><button class="btn" onclick="saveQ()">រក្សាទុក</button></div>')}
function saveQ(){const o=[0,1,2,3].map(k=>$('#fo'+k).value.trim()),t=$('#fq').value.trim();if(!t||o.some(x=>!x))return toast('សូមបំពេញសំណួរ និងជម្រើសទាំង ៤');const n={q:t,o,a:+$('#fa').value,c:+$('#fc').value,d:$('#fd').value,e:$('#fe').value.trim()};if(_eid){const i=bank.findIndex(x=>x.id==_eid);bank[i]={...bank[i],...n}}else bank.push({id:'u'+Date.now(),...n});save();closeM();toast('បានរក្សាទុក');R()}
function delQ(id){confirmM('លុបសំណួរ?','សកម្មភាពនេះមិនអាចត្រឡប់វិញបានទេ។',()=>{bank=bank.filter(x=>x.id!=id);bm=bm.filter(x=>x!=id);save();toast('បានលុប');R()},'លុប')}
function expM(){const j=JSON.stringify(bank.map(({id,...r})=>r),null,1),c='q,A,B,C,D,answer,category,difficulty,explanation\n'+bank.map(q=>[q.q,...q.o,L[q.a],q.c,q.d,q.e||''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');window._ex={json:j,csv:c};modal('<h3>នាំចេញសំណួរ</h3><div class="chips"><button class="chip on" id="tj" onclick="exT(\'json\')">JSON</button><button class="chip" id="tc" onclick="exT(\'csv\')">CSV</button></div><textarea class="i" id="exa" rows="12" readonly style="margin-top:12px;font-family:monospace;font-size:.8rem">'+esc(j)+'</textarea><div class="ra"><button class="btn g" onclick="closeM()">បិទ</button><button class="btn" onclick="$(\'#exa\').select();try{navigator.clipboard.writeText($(\'#exa\').value);toast(\'បានចម្លង\')}catch(e){document.execCommand(\'copy\')}">ចម្លង</button></div>')}
function exT(t){$('#exa').value=_ex[t];$('#tj').classList.toggle('on',t=='json');$('#tc').classList.toggle('on',t=='csv')}
function impM(){modal('<h3>នាំចូលសំណួរ</h3><p style="color:var(--mut)">បិទភ្ជាប់ JSON (<code>[{q,o:[4],a:0-3,c,d,e}]</code>) ឬ CSV (<code>q,A,B,C,D,answer,category,difficulty,explanation</code>) ឬជ្រើសឯកសារ។</p><input type="file" accept=".json,.csv,.txt" onchange="const f=this.files[0];if(f){const r=new FileReader();r.onload=()=>$(\'#ia\').value=r.result;r.readAsText(f)}"><textarea class="i" id="ia" rows="9" style="margin-top:10px;font-family:monospace;font-size:.8rem"></textarea><div class="ra"><button class="btn g" onclick="closeM()">បោះបង់</button><button class="btn" onclick="doImp()">នាំចូល</button></div>')}
function csvP(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
function doImp(){const t=$('#ia').value.trim();if(!t)return toast('មិនមានទិន្នន័យ');let a=[];try{if(t[0]=='['||t[0]=='{'){a=JSON.parse(t);if(!Array.isArray(a))a=[a]}else{const rs=csvP(t);if(/^q$/i.test(rs[0][0]))rs.shift();a=rs.map(x=>({q:x[0],o:x.slice(1,5),a:/^[A-Da-d]$/.test((x[5]||'').trim())?'ABCD'.indexOf(x[5].trim().toUpperCase()):(+x[5]||1)-1,c:+x[6]||0,d:x[7]||'m',e:x[8]||''}))}}catch(e){return toast('ទម្រង់ទិន្នន័យមិនត្រឹមត្រូវ')}
let ok=0,bad=0;a.forEach(x=>{const v=x&&typeof x.q=='string'&&x.q.trim()&&Array.isArray(x.o)&&x.o.length==4&&x.o.every(s=>String(s).trim())&&Number.isInteger(+x.a)&&x.a>=0&&x.a<4;if(!v){bad++;return}ok++;bank.push({id:'u'+Date.now()+ok,q:x.q.trim(),o:x.o.map(String),a:+x.a,c:CATS[x.c]?+x.c:0,d:DF[x.d]?x.d:'m',e:x.e||''})});save();closeM();toast('នាំចូល '+dg(ok)+' · បដិសេធ '+dg(bad));R()}
/* other views */
function historyV(){return shell('history','ប្រវត្តិប្រឡង','<div class="card">'+(hist.length?hist.slice().reverse().map(h=>'<div class="rw"><div><b>'+dg(h.score)+'/'+dg(h.total)+'</b> <span class="badge">'+MN[h.mode]+'</span><br><small>'+h.date+' · '+fmt(h.spent||0)+'</small></div><span class="badge '+(h.pct>=set.pass?'e':'h')+'">'+dg(h.pct)+'%</span></div>').join('')+'<div class="ra"><button class="btn d s" onclick="confirmM(\'លុបប្រវត្តិ?\',\'ប្រវត្តិទាំងអស់នឹងត្រូវលុប។\',()=>{hist=[];save();R()},\'លុប\')">លុបប្រវត្តិ</button></div>':'<div class="emp">'+ic('inbox',36)+'<br>មិនទាន់មានប្រវត្តិប្រឡងទេ</div>')+'</div>')}
function statsV(){return shell('stats','ស្ថិតិ និងវឌ្ឍនភាព','<div class="g4">'+[['trophy','ពិន្ទុជាមធ្យម',dg(pctAvg())+'%'],['target','ភាពត្រឹមត្រូវ',dg(acc())+'%'],['scroll','ចំនួនការប្រឡង',dg(hist.length)],['xc','សំណួរត្រូវពិនិត្យ',dg(wrong.length)]].map(s=>'<div class="card st"><i>'+ic(s[0],22)+'</i><div><small>'+s[1]+'</small><b>'+s[2]+'</b></div></div>').join('')+'</div><div class="card"><h3>វឌ្ឍនភាពតាមប្រធានបទ</h3>'+CATS.map((c,i)=>{const n=cnt(i),d=done(i),p=n?Math.round(d/n*100):0;return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>'+ic(c[1],16)+' '+c[0]+'</span><small>'+dg(d)+'/'+dg(n)+' · '+dg(p)+'%</small></div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}).join('')+'</div>')}
function bmV(){const l=bank.filter(q=>bm.includes(q.id));return shell('bookmarks','សំណួរដែលបានរក្សា','<div class="card">'+(l.length?l.map(q=>'<div class="rw"><div>'+esc(q.q)+'<br><small style="color:var(--em)">'+ic('check',13)+' '+L[q.a]+'. '+esc(q.o[q.a])+'</small></div><button class="btn g s" onclick="togBm(\''+q.id+'\')">'+ic('x',15)+'</button></div>').join('')+'<div class="ra"><button class="btn" onclick="cfg.mode=\'review\';cfg.cat=\'all\';go(\'practice\')">ពិនិត្យឡើងវិញ</button></div>':'<div class="emp">'+ic('bookmark',36)+'<br>មិនទាន់មានសំណួរដែលបានរក្សាទេ</div>')+'</div>')}
function settingsV(){return shell('settings','ការកំណត់','<div class="card" style="max-width:520px"><label class="f">ពិន្ទុជាប់ (%)</label><input class="i" type="number" min="1" max="100" value="'+set.pass+'" onchange="set.pass=Math.min(100,Math.max(1,+this.value||50));save();toast(\'បានរក្សាទុក\')"><label class="f">រូបរាង</label><div class="chips"><button class="chip '+(set.theme=='light'?'on':'')+'" onclick="setTh(\'light\')">'+ic('sun',16)+' ភ្លឺ</button><button class="chip '+(set.theme=='dark'?'on':'')+'" onclick="setTh(\'dark\')">'+ic('moon',16)+' ងងឹត</button></div><label class="f">ទិន្នន័យ</label><button class="btn d s" onclick="confirmM(\'កំណត់ឡើងវិញ?\',\'វឌ្ឍនភាព ប្រវត្តិ និងសំណួរដែលបានបន្ថែមនឹងត្រូវលុប។\',()=>{try{localStorage.clear()}catch(e){};location.reload()},\'កំណត់ឡើងវិញ\')">កំណត់ទិន្នន័យឡើងវិញ</button></div>')}
function setTh(t){set.theme=t;document.documentElement.dataset.theme=t;save();R()}
const V={'':dash,practice:setup,quiz,result,bank:bankV,history:historyV,stats:statsV,bookmarks:bmV,settings:settingsV};
function R(){const h=(location.hash||'#/').slice(2).split('?')[0];if(h!='quiz'&&TI&&S&&!S.fin){/* keep timer */}$('#root').innerHTML=(V[h]||dash)();window.scrollTo(0,0)}
addEventListener('hashchange',R);
addEventListener('keydown',e=>{if(location.hash!='#/quiz'||!S||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('#ov').firstChild)return;const k='1234'.indexOf(e.key);if(k>=0)pickA(k);else if(e.key=='ArrowRight')mv(1);else if(e.key=='ArrowLeft')mv(-1)});
R();
</script></body></html>
